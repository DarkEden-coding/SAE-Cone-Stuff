# XcodeGen spec. Generate with `xcodegen` (see README.md).
name: ConeCapture
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 5 language mode (Swift 6 compiler OK); avoids strict-concurrency errors
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"     # iPhone only
    DEVELOPMENT_TEAM: ""            # set your Apple team ID here or in Xcode Signing & Capabilities
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ConeCapture:
    type: application
    platform: iOS
    sources:
      - ConeCapture
    info:
      path: Support/Info.plist       # generated by XcodeGen (kept out of the sources dir on purpose)
      properties:
        CFBundleDisplayName: Cone Capture
        NSCameraUsageDescription: "Cone Capture records photos and video together with camera intrinsics for cone detection."
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        # Tailscale `serve` URLs (https://<machine>.<tailnet>.ts.net) are HTTPS anyway; this only
        # matters if you point the app at a plain http:// tailnet IP / MagicDNS name for testing.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ConeCapture
        CODE_SIGN_STYLE: Automatic
  ConeCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ConeCaptureTests
    dependencies:
      - target: ConeCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ConeCaptureTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ConeCapture:
    build:
      targets:
        ConeCapture: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ConeCaptureTests
